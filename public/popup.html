<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FotStats</title>
    <!-- Shared with the in-page overlay; see src/view/. -->
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="card.css" />
    <style>
      /* Popup shell only. Anything that styles the card itself belongs in
         card.css, where the overlay can reach it too. */
      body {
        width: 380px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .capture {
        display: block;
        margin-top: 8px;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--panel);
        color: var(--muted);
        font: inherit;
        font-size: 10.5px;
        cursor: pointer;
      }
      .capture:hover { color: var(--fg); }
      .empty { padding: 26px 8px; text-align: center; color: var(--muted); }
      .empty strong { display: block; margin-bottom: 4px; color: var(--fg); font-size: 13px; }
    </style>
  </head>
  <body>
    <main id="root"><div class="empty">Loading…</div></main>
    <script src="popup.js"></script>
  </body>
</html>

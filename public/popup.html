<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FotStats</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #10131a;
        --muted: #626a7a;
        --line: #e3e6ec;
        --panel: #f6f7f9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161c;
          --fg: #eef1f6;
          --muted: #98a1b3;
          --line: #262a34;
          --panel: #1b1e26;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 380px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .teams {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .team-name { font-weight: 600; font-size: 14px; }
      .score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; }
      .status { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
      .live::before {
        content: "";
        display: inline-block;
        width: 6px; height: 6px;
        margin-right: 5px;
        border-radius: 50%;
        background: #e5484d;
      }
      section { margin-top: 14px; }
      h2 {
        margin: 0 0 6px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .07em;
        color: var(--muted);
      }
      .bar {
        display: flex;
        height: 22px;
        border-radius: 5px;
        overflow: hidden;
        background: var(--panel);
      }
      .seg { height: 100%; }
      .legend {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        margin-top: 7px;
        font-size: 11px;
        color: var(--muted);
      }
      .legend span { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
      .legend b { color: var(--fg); font-variant-numeric: tabular-nums; }
      /* Ties each figure to its line in the chart. */
      .swatch { flex: none; width: 8px; height: 8px; border-radius: 2px; }
      .legend .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chart { position: relative; }
      .chart svg { display: block; overflow: visible; }
      .grid { stroke: var(--line); stroke-width: 1; }
      .axis { fill: var(--muted); font-size: 9px; }
      /* Three probability lines share one 0-100% axis. */
      .series { stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      /* The part of the match still to be played, on a live chart. */
      .unplayed { fill: var(--panel); }
      .now { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 2; }
      .marker-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
      .marker-dot { stroke: var(--bg); stroke-width: 1; }
      .scrub { stroke: var(--muted); stroke-width: 1; }
      .tooltip {
        position: absolute;
        top: 6px;
        padding: 5px 7px;
        border-radius: 4px;
        background: rgba(16,19,26,.92);
        color: #fff;
        font-size: 10.5px;
        line-height: 1.4;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        white-space: nowrap;
        display: none;
      }
      .events { margin: 8px 0 0; padding: 0; list-style: none; font-size: 11px; color: var(--muted); }
      .events li { display: flex; gap: 6px; padding: 1px 0; }
      .events .min { min-width: 30px; color: var(--fg); font-variant-numeric: tabular-nums; }
      footer {
        margin-top: 14px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        font-size: 10.5px;
        color: var(--muted);
      }
      .capture {
        display: block;
        margin-top: 8px;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--panel);
        color: var(--muted);
        font: inherit;
        font-size: 10.5px;
        cursor: pointer;
      }
      .capture:hover { color: var(--fg); }
      .empty { padding: 26px 8px; text-align: center; color: var(--muted); }
      .empty strong { display: block; margin-bottom: 4px; color: var(--fg); font-size: 13px; }
      .warn {
        margin-top: 6px;
        color: #d97706;
        font-size: 10.5px;
        line-height: 1.5;
        /* Diagnostics describe the payload's actual shape — they need to wrap
           and be selectable so they can be copied out. */
        overflow-wrap: anywhere;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <main id="root"><div class="empty">Loading…</div></main>
    <script src="popup.js"></script>
  </body>
</html>
